<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>School Intercom Test</title>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script defer src="app.js"></script>
</head>

<body>

<h1>🎙 School Intercom</h1>

<div class="card">

<input
id="roomId"
placeholder="ルームID">

<div class="buttons">

<button id="hostBtn">
作成
</button>

<button id="joinBtn">
接続
</button>

</div>

</div>

<div id="status">
未接続
</div>

<button id="unlockBtn">
🔊 音声初期化
</button>

<button id="ptt" disabled>
PTT
</button>

<audio
id="remoteAudio"
autoplay
playsinline>
</audio>

</body>
</html>
