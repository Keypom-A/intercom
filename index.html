<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>簡易インカム (合言葉P2P)</title>
  <!-- 軽量シグナリング用 MQTT.js (CDN) -->
  <script src="https://unpkg.com"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 12px 0;
      color: #e0e0e0;
    }
    .status-bar {
      width: 100%;
      max-width: 400px;
      background: #1e1e1e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid #333;
      line-height: 1.4;
    }
    .status-connected {
      border-color: #00e676;
      color: #00e676;
      font-weight: bold;
    }
    .status-waiting {
      border-color: #ffab00;
      color: #ffab00;
    }

    /* 合言葉セットアップエリア */
    .setup-container {
      width: 100%;
      max-width: 400px;
      background: #1e1e1e;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label {
      font-size: 0.85rem;
      color: #bbb;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      background: #121212;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 0.05em;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #2979ff;
    }
    .action-btn {
      padding: 14px;
      background: #2979ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .action-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
    .disconnect-btn {
      background: #c62828;
      margin-top: 4px;
    }

    /* プッシュ・トゥ・トーク（PTT）エリア */
    .ptt-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 10px 0;
    }
    #pttButton {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 8px solid #333;
      background: radial-gradient(circle, #2c2c2c 0%, #1a1a1a 100%);
      color: #888;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      transition: transform 0.08s, border-color 0.15s, background 0.15s;
    }
    #pttButton.ready {
      border-color: #2979ff;
      color: #ffffff;
      cursor: pointer;
    }
    #pttButton.talking {
      transform: scale(0.95);
      border-color: #ff1744;
      background: radial-gradient(circle, #d50000 0%, #8e0000 100%);
      color: #ffffff;
      box-shadow: 0 0 30px rgba(255, 23, 68, 0.6);
    }
    #pttButton span.sub {
      font-size: 0.8rem;
      font-weight: normal;
      margin-top: 6px;
      opacity: 0.8;
    }

    /* 下部コントロール */
    .controls {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }
    .small-btn {
      padding: 10px 14px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <h1>🎙️ 簡易インカム (合言葉P2P)</h1>

  <div id="statusBar" class="status-bar">
    状態: 未接続（合言葉を入れて接続）
  </div>

  <!-- 合言葉入力UI -->
  <div class="setup-container">
    <label for="passphrase">2人で同じ「合言葉」を入力してください</label>
    <input type="text" id="passphrase" placeholder="例: hall-staff-01" autocomplete="off">
    <button id="connectBtn" class="action-btn" onclick="startConnection()">マイク許可＆接続開始</button>
    <button id="disconnectBtn" class="action-btn disconnect-btn" onclick="resetConnection()" style="display:none;">切断する</button>
  </div>

  <!-- プッシュ・トゥ・トーク（PTT）ボタン -->
  <div class="ptt-container">
    <button id="pttButton" disabled>
      <span id="pttMainText">未接続</span>
      <span id="pttSubText" class="sub">接続後に押して通話</span>
    </button>
  </div>

  <!-- iPhone Safari 音声再生保証用 -->
  <div class="controls">
    <button class="small-btn" onclick="unlockAudio()">🔊 相手の声が聞こえない時はタップ</button>
  </div>

  <!-- iOS Safari対策: playsinline と autoplay を必須指定 -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    let peerConnection = null;
    let localStream = null;
    let audioTrack = null;
    let mqttClient = null;
    let topicName = '';
    const myId = 'peer_' + Math.random().toString(36).substring(2, 10);
    let isMakingOffer = false;
    let polite = false; // 同時接続衝突（Glare）解決用フラグ

    // GoogleのSTUNサーバー設定
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:://google.com' },
        { urls: 'stun:://google.com' },
        { urls: 'stun:://google.com' }
      ]
    };

    const statusBar = document.getElementById('statusBar');
    const pttButton = document.getElementById('pttButton');
    const pttMainText = document.getElementById('pttMainText');
    const pttSubText = document.getElementById('pttSubText');
    const remoteAudio = document.getElementById('remoteAudio');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const passphraseInput = document.getElementById('passphrase');

    function updateStatus(text, type = 'normal') {
      statusBar.textContent = text;
      statusBar.classList.remove('status-connected', 'status-waiting');
      if (type === 'connected') statusBar.classList.add('status-connected');
      if (type === 'waiting') statusBar.classList.add('status-waiting');
    }

    // 合言葉をSHA-256でハッシュ化して他と被らないトピック名を生成
    async function hashPassphrase(pass) {
      const msgUint8 = new TextEncoder().encode('webrtc-ptt-intercom-' + pass.trim());
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return 'intercom/' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // マイク初期化（エコーキャンセル有効）
    async function initMicrophone() {
      if (localStream) return true;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
        audioTrack = localStream.getAudioTracks();
        audioTrack.enabled = false;
        return true;
      } catch (err) {
        alert('マイクの使用が許可されませんでした。設定を確認してください。\nエラー: ' + err.message);
        return false;
      }
    }

    // WebRTCピア接続の構築
    function setupPeerConnection() {
      if (peerConnection) {
        peerConnection.close();
      }
      peerConnection = new RTCPeerConnection(rtcConfig);

      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.ontrack = (event) => {
        if (remoteAudio.srcObject !== event.streams) {
          remoteAudio.srcObject = event.streams;
          remoteAudio.play().catch(e => console.log('自動再生待機:', e));
        }
      };

      // ICE候補が見つかるたびに相手へ送信（Trickle ICEで高速接続）
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal({ type: 'candidate', candidate: event.candidate });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        const state = peerConnection.connectionState;
        if (state === 'connected') {
          updateStatus('🟢 通話可能（P2P直接接続完了）', 'connected');
          enablePTT();
          // P2Pが確立したら仲介サーバー（MQTT）は切断して省電力化
          if (mqttClient) {
            mqttClient.end();
            mqttClient = null;
          }
        } else if (state === 'disconnected' || state === 'failed') {
          updateStatus('🔴 接続が切れました。再接続してください。');
          disablePTT();
        }
      };
    }

    function sendSignal(payload) {
      if (mqttClient && mqttClient.connected) {
        payload.sender = myId;
        mqttClient.publish(topicName, JSON.stringify(payload));
      }
    }

    // 合言葉での接続開始
    async function startConnection() {
      const pass = passphraseInput.value.trim();
      if (!pass) {
        alert('合言葉を入力してください。');
        return;
      }

      unlockAudio();
      const micOk = await initMicrophone();
      if (!micOk) return;

      connectBtn.disabled = true;
      passphraseInput.disabled = true;
      disconnectBtn.style.display = 'block';
      updateStatus('🟡 相手を探しています...（相手も接続を押してください）', 'waiting');

      topicName = await hashPassphrase(pass);
      setupPeerConnection();

      // 無料パブリックMQTTブローカー（WSS）に接続
      mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: myId,
        clean: true,
        connectTimeout: 5000
      });

      mqttClient.on('connect', () => {
        mqttClient.subscribe(topicName, (err) => {
          if (!err) {
            // 入室を通知
            sendSignal({ type: 'join' });
          }
        });
      });

      mqttClient.on('message', async (topic, message) => {
        if (topic !== topicName) return;
        let data;
        try {
          data = JSON.parse(message.toString());
        } catch (e) {
          return;
        }
