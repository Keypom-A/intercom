<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>簡易インカム (P2Pトランシーバー)</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 12px 0;
      color: #e0e0e0;
    }
    .status-bar {
      width: 100%;
      max-width: 400px;
      background: #1e1e1e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid #333;
    }
    .status-connected {
      border-color: #00e676;
      color: #00e676;
      font-weight: bold;
    }

    /* 接続セットアップエリア */
    .setup-container {
      width: 100%;
      max-width: 400px;
      background: #1e1e1e;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #2c2c2c;
      color: #aaa;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #2979ff;
      color: #fff;
    }
    .step-box {
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .step-box.active {
      display: flex;
    }
    label {
      font-size: 0.85rem;
      color: #bbb;
    }
    textarea {
      width: 100%;
      height: 68px;
      background: #121212;
      color: #00e676;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px;
      font-size: 0.75rem;
      font-family: monospace;
      resize: none;
    }
    .action-btn {
      padding: 12px;
      background: #2979ff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }
    .action-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
    .copy-btn {
      background: #00897b;
    }

    /* プッシュ・トゥ・トーク（PTT）エリア */
    .ptt-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 10px 0;
    }
    #pttButton {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 8px solid #333;
      background: radial-gradient(circle, #2c2c2c 0%, #1a1a1a 100%);
      color: #888;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      transition: transform 0.08s, border-color 0.15s, background 0.15s;
    }
    #pttButton.ready {
      border-color: #2979ff;
      color: #ffffff;
      cursor: pointer;
    }
    #pttButton.talking {
      transform: scale(0.95);
      border-color: #ff1744;
      background: radial-gradient(circle, #d50000 0%, #8e0000 100%);
      color: #ffffff;
      box-shadow: 0 0 30px rgba(255, 23, 68, 0.6);
    }
    #pttButton span.sub {
      font-size: 0.8rem;
      font-weight: normal;
      margin-top: 6px;
      opacity: 0.8;
    }

    /* 音量設定・オーディオ解除 */
    .controls {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }
    .small-btn {
      padding: 8px 12px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <h1>🎙️ 簡易インカム (P2P)</h1>

  <div id="statusBar" class="status-bar">
    状態: 未接続（上の手順で接続してください）
  </div>

  <!-- 接続セットアップUI -->
  <div id="setupContainer" class="setup-container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('host')">① 親機（招待を作る）</button>
      <button class="tab-btn" onclick="switchTab('guest')">② 子機（招待を受ける）</button>
    </div>

    <!-- 親機（Offer側） -->
    <div id="hostPanel" class="step-box active">
      <button id="createOfferBtn" class="action-btn" onclick="createOffer()">1. マイク許可＆招待コード作成</button>
      
      <label>2. この「招待コード」をコピーして相手に送る</label>
      <textarea id="offerOutput" readonly placeholder="上のボタンを押すとコードが生成されます..."></textarea>
      <button class="action-btn copy-btn" onclick="copyText('offerOutput')">招待コードをコピー</button>

      <label>3. 相手から返ってきた「返答コード」を貼り付け</label>
      <textarea id="answerInput" placeholder="相手の返答コードをここに貼り付け..."></textarea>
      <button id="connectAnswerBtn" class="action-btn" onclick="acceptAnswer()">4. 接続完了する</button>
    </div>

    <!-- 子機（Answer側） -->
    <div id="guestPanel" class="step-box">
      <label>1. 相手から届いた「招待コード」を貼り付け</label>
      <textarea id="offerInput" placeholder="親機の招待コードをここに貼り付け..."></textarea>
      <button id="createAnswerBtn" class="action-btn" onclick="createAnswer()">2. マイク許可＆返答コード作成</button>

      <label>3. この「返答コード」をコピーして相手に送り返す</label>
      <textarea id="answerOutput" readonly placeholder="上のボタンを押すと返答コードが生成されます..."></textarea>
      <button class="action-btn copy-btn" onclick="copyText('answerOutput')">返答コードをコピー</button>
    </div>
  </div>

  <!-- プッシュ・トゥ・トーク（PTT）ボタン -->
  <div class="ptt-container">
    <button id="pttButton" disabled>
      <span id="pttMainText">未接続</span>
      <span id="pttSubText" class="sub">接続後に押して通話</span>
    </button>
  </div>

  <!-- iPhone Safari 音声再生保証用＆再接続用コントロール -->
  <div class="controls">
    <button class="small-btn" onclick="unlockAudio()">🔊 相手の声が聞こえない時はタップ</button>
    <button class="small-btn" onclick="toggleSetup()">⚙️ 接続画面を表示/隠す</button>
  </div>

  <!-- iOS Safari対策: playsinline と autoplay を必須指定 -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    let peerConnection = null;
    let localStream = null;
    let audioTrack = null;

    // GoogleのSTUNサーバー設定（公共Wi-Fi等のNAT越え用）
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:://google.com' },
        { urls: 'stun:://google.com' },
        { urls: 'stun:://google.com' }
      ]
    };

    const statusBar = document.getElementById('statusBar');
    const pttButton = document.getElementById('pttButton');
    const pttMainText = document.getElementById('pttMainText');
    const pttSubText = document.getElementById('pttSubText');
    const remoteAudio = document.getElementById('remoteAudio');

    // タブ切り替え
    function switchTab(role) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.step-box').forEach(p => p.classList.remove('active'));
      if (role === 'host') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('hostPanel').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('guestPanel').classList.add('active');
      }
    }

    function toggleSetup() {
      document.getElementById('setupContainer').classList.toggle('hidden');
    }

    function updateStatus(text, isConnected = false) {
      statusBar.textContent = text;
      if (isConnected) {
        statusBar.classList.add('status-connected');
      } else {
        statusBar.classList.remove('status-connected');
      }
    }

    // マイクの初期化（エコーキャンセル・ノイズ抑制有効）
    async function initMicrophone() {
      if (localStream) return true;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
        audioTrack = localStream.getAudioTracks()[0];
        // 初期状態はミュート（プッシュ・トゥ・トークのため）
        audioTrack.enabled = false;
        return true;
      } catch (err) {
        alert('マイクの使用が許可されませんでした。ブラウザの設定を確認してください。\nエラー: ' + err.message);
        return false;
      }
    }

    // WebRTCピア接続の初期化
    function createPeerConnection() {
      if (peerConnection) {
        peerConnection.close();
      }
      peerConnection = new RTCPeerConnection(rtcConfig);

      // 自分の音声トラックを追加
      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      // 相手の音声を受信した時の処理
      peerConnection.ontrack = (event) => {
        if (remoteAudio.srcObject !== event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
          remoteAudio.play().catch(e => console.log('自動再生ブロック待機:', e));
        }
      };

      // 接続状態の監視
      peerConnection.onconnectionstatechange = () => {
        const state = peerConnection.connectionState;
        if (state === 'connected') {
          updateStatus('🟢 通話可能（P2P接続完了）', true);
          enablePTT();
          document.getElementById('setupContainer').classList.add('hidden');
        } else if (state === 'disconnected' || state === 'failed' || state === 'closed') {
          updateStatus('🔴 切断されました（再接続が必要です）', false);
          disablePTT();
        }
      };
    }

    // ICE候補の収集完了を待つ（サーバーレスで1回でコピペ完了させるため）
    function waitForIceGathering(pc) {
      return new Promise((resolve) => {
        if (pc.iceGatheringState === 'complete') {
          resolve();
        } else {
          const checkState = () => {
            if (pc.iceGatheringState === 'complete') {
